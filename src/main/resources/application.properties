discord.token=${DISCORD_TOKEN}
discord.shards.total=${DISCORD_SHARDS_TOTAL:1}
discord.shards.ids=${DISCORD_SHARDS_IDS:0}


source.spotify.client.id=${SPOTIFY_CLIENT_ID:disabled}
source.spotify.client.secret=${SPOTIFY_CLIENT_SECRET:disabled}

quarkus.cache.caffeine."search".maximum-size=1000
quarkus.cache.caffeine."search".expire-after-write=PT60M


# Database. Defaults to an embedded H2 file database, switch to postgres by setting
# DB_KIND=postgresql, DB_URL, DB_USERNAME and DB_PASSWORD
quarkus.datasource.db-kind=${DB_KIND:h2}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:h2:file:/data/lagit}
quarkus.datasource.username=${DB_USERNAME:}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.hibernate-orm.database.generation=none

quarkus.liquibase.change-log=db/changeLog/master.yaml
quarkus.liquibase.migrate-at-start=true

# Tests use an in-memory database and must not start the Discord connection
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:lagit;DB_CLOSE_DELAY=-1
%test.quarkus.arc.exclude-types=org.tiagop.lagit.Bot
